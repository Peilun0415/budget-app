<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UI 預覽｜貓貓記帳</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    :root {
      --pink-light: #f3f6f4;
      --pink-mid: #c5ddd4;
      --pink-main: #4e8f7c;
      --pink-dark: #3d7465;
      --primary-rgb: 78, 143, 124;
      --green-main: #38a884;
      --red-main: #f27d6d;
      --text-dark: #18212b;
      --text-mid: #5a6570;
      --text-light: #9aa3ad;
      --white: #fff;
      --bg: #f4f2ee;
      --border: #e5e2dc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: #ece8e1;
      color: var(--text-dark);
      min-height: 100vh;
    }
    .studio {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }
    .studio-head h1 { font-size: 22px; letter-spacing: .4px; }
    .studio-head p { color: var(--text-mid); margin-top: 6px; font-size: 14px; line-height: 1.6; }
    .picker {
      display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 12px;
    }
    .picker button {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text-dark);
      padding: 8px 14px;
      border-radius: 999px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .picker button.active {
      background: var(--pink-main);
      border-color: var(--pink-main);
      color: #fff;
    }
    .desc {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 22px;
      font-size: 13px;
      line-height: 1.7;
      color: var(--text-mid);
    }
    .desc strong { color: var(--text-dark); }
    .phones {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
    }
    .phone-wrap h3 {
      font-size: 13px;
      color: var(--text-mid);
      margin-bottom: 10px;
      font-weight: 700;
    }
    .phone {
      width: 100%;
      max-width: 390px;
      height: 760px;
      background: #111;
      border-radius: 36px;
      padding: 12px;
      box-shadow: 0 18px 40px rgba(24,33,43,.18);
    }
    .screen {
      height: 100%;
      border-radius: 26px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .scroll { flex: 1; overflow: auto; }
    .scroll::-webkit-scrollbar { width: 0; }
    .nav {
      display: flex; align-items: flex-end; justify-content: space-between;
      padding: 8px 10px 14px;
      flex-shrink: 0;
    }
    .nav-btn { flex: 1; background: none; border: 0; color: var(--text-light); font: inherit; text-align: center; font-size: 10px; font-weight: 700; }
    .nav-btn span { display: block; font-size: 18px; margin-bottom: 2px; }
    .nav-btn.on { color: var(--pink-main); }
    .fab {
      width: 46px; height: 46px; border-radius: 50%;
      background: var(--pink-main); color: #fff; border: 0;
      font-size: 22px; display: grid; place-items: center; margin: 0 8px 8px;
    }
    .row { display: flex; align-items: center; }
    .muted { color: var(--text-light); }
    .mid { color: var(--text-mid); }
    .green { color: var(--green-main); }
    .red { color: var(--red-main); }
    .money { font-weight: 700; font-variant-numeric: tabular-nums; }

    /* ===== A 線條清單 ===== */
    .a { background: #f2f2f7; color: #1c1c1e; }
    .a .top { padding: 18px 20px 8px; }
    .a .top .month { font-size: 28px; font-weight: 800; letter-spacing: -.4px; }
    .a .sub { font-size: 12px; color: #8e8e93; margin-top: 2px; }
    .a .stats {
      margin: 10px 16px 0;
      background: #fff; border-radius: 12px; overflow: hidden;
    }
    .a .stat {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 14px; font-size: 15px;
      border-bottom: .5px solid #e5e5ea;
    }
    .a .stat:last-child { border-bottom: 0; }
    .a .search {
      margin: 12px 16px; background: rgba(118,118,128,.12);
      border-radius: 10px; padding: 8px 12px; font-size: 14px; color: #8e8e93;
    }
    .a .group { margin: 8px 16px 16px; background: #fff; border-radius: 12px; overflow: hidden; }
    .a .date {
      padding: 8px 14px 4px; font-size: 12px; color: #8e8e93; font-weight: 600;
    }
    .a .item {
      display: flex; gap: 10px; align-items: center;
      padding: 10px 14px; border-top: .5px solid #e5e5ea;
    }
    .a .emoji { width: 28px; text-align: center; font-size: 20px; }
    .a .name { font-size: 15px; font-weight: 600; }
    .a .meta { font-size: 12px; color: #8e8e93; margin-top: 1px; }
    .a .amt { margin-left: auto; font-size: 15px; font-weight: 700; }
    .a .ah { padding: 18px 20px 10px; }
    .a .hero { font-size: 34px; font-weight: 800; letter-spacing: -.6px; }
    .a .split { display: flex; gap: 18px; margin-top: 6px; font-size: 12px; color: #8e8e93; }
    .a .hdr { padding: 18px 16px 6px; font-size: 13px; color: #8e8e93; text-transform: none; }
    .a .nav { background: rgba(249,249,249,.92); border-top: .5px solid #c6c6c8; }

    /* ===== B 儀表板 ===== */
    .b { background: #f7f5f1; }
    .b .hero-card {
      margin: 16px 16px 0; padding: 18px 18px 16px;
      background: linear-gradient(160deg, #4e8f7c, #3d7465);
      color: #fff; border-radius: 22px;
    }
    .b .hero-card .k { opacity: .8; font-size: 12px; }
    .b .hero-card .v { font-size: 30px; font-weight: 800; margin: 4px 0 12px; }
    .b .bars { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .b .mini { background: rgba(255,255,255,.14); border-radius: 12px; padding: 8px 10px; }
    .b .mini .k { font-size: 11px; opacity: .8; }
    .b .mini .v { font-size: 15px; font-weight: 700; }
    .b .tools { display: flex; gap: 8px; padding: 12px 16px 0; }
    .b .chip {
      flex: 1; background: #fff; border: 1px solid var(--border);
      border-radius: 12px; padding: 8px; text-align: center; font-size: 12px; font-weight: 700;
    }
    .b .panel {
      margin: 12px 16px 0; background: #fff; border: 1px solid var(--border);
      border-radius: 18px; overflow: hidden;
    }
    .b .panel h4 {
      padding: 12px 14px 8px; font-size: 13px; color: var(--text-mid);
    }
    .b .item { display: flex; gap: 10px; align-items: center; padding: 10px 14px; }
    .b .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red-main); flex-shrink: 0; }
    .b .name { font-size: 14px; font-weight: 650; }
    .b .meta { font-size: 11px; color: var(--text-light); }
    .b .amt { margin-left: auto; font-size: 14px; font-weight: 700; }
    .b .acc {
      margin: 12px 16px; background: #fff; border: 1px solid var(--border); border-radius: 18px; padding: 6px 0 8px;
    }
    .b .acc .lab { padding: 8px 14px 4px; font-size: 11px; letter-spacing: .8px; color: var(--text-light); font-weight: 700; }
    .b .nav { background: #fff; border-top: 1px solid var(--border); }

    /* ===== C 精煉卡片 ===== */
    .c { background: #faf9f7; }
    .c .bar {
      display: flex; align-items: center; justify-content: center; gap: 14px;
      padding: 12px; background: #fff; border-bottom: 1px solid var(--border);
      font-weight: 700; font-size: 16px;
    }
    .c .sum {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 12px 14px 0;
    }
    .c .card {
      background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 10px 8px; text-align: center;
    }
    .c .card .k { font-size: 11px; color: var(--text-light); }
    .c .card .v { font-size: 15px; font-weight: 800; margin-top: 2px; }
    .c .search {
      margin: 12px 14px 0; display: flex; gap: 8px;
    }
    .c .search div {
      flex: 1; background: #fff; border: 1px solid var(--border); border-radius: 12px;
      padding: 8px 12px; font-size: 13px; color: var(--text-light);
    }
    .c .day {
      margin: 12px 14px 0; background: #fff; border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
    }
    .c .day-h {
      display: flex; justify-content: space-between;
      padding: 8px 12px; background: var(--pink-light); font-size: 12px; font-weight: 700; color: var(--text-mid);
    }
    .c .item { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border-top: 1px solid #f0eeea; }
    .c .ico { width: 32px; height: 32px; border-radius: 10px; background: #fef0ee; display: grid; place-items: center; }
    .c .name { font-size: 15px; font-weight: 650; }
    .c .meta { font-size: 12px; color: var(--text-light); }
    .c .amt { margin-left: auto; font-size: 15px; font-weight: 700; }
    .c .net {
      margin: 14px; padding: 16px; background: #fff; border: 1px solid var(--border); border-radius: 16px; text-align: center;
    }
    .c .net .k { font-size: 11px; color: var(--text-light); }
    .c .net .v { font-size: 24px; font-weight: 800; color: var(--pink-main); }
    .c .g { margin: 0 14px 10px; }
    .c .g h4 { font-size: 12px; color: var(--text-mid); margin: 0 4px 6px; }
    .c .acc {
      background: #fff; border: 1px solid var(--border); border-radius: 12px;
      display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 4px;
    }
    .c .nav { background: #fff; border-top: 1px solid var(--border); }
  </style>
</head>
<body>
  <div class="studio">
    <div class="studio-head">
      <h1>三套 UI 方向預覽</h1>
      <p>主題色維持鼠尾草綠。這是靜態示意，還沒改正式 App。選一版後我再套到全部畫面。</p>
    </div>
    <div class="picker" id="stylePicker">
      <button class="active" data-style="a">A 線條清單</button>
      <button data-style="b">B 月結儀表板</button>
      <button data-style="c">C 精煉日卡片</button>
    </div>
    <div class="desc" id="desc"></div>
    <div class="phones">
      <div class="phone-wrap">
        <h3>記帳首頁</h3>
        <div class="phone"><div class="screen" id="homeScreen"></div></div>
      </div>
      <div class="phone-wrap">
        <h3>帳戶管理</h3>
        <div class="phone"><div class="screen" id="accScreen"></div></div>
      </div>
    </div>
  </div>
  <script>
    const DESCS = {
      a: "<strong>A 線條清單</strong>：拿掉散落卡片，改成 iOS 分組列表。月份當大標題，收支變成列，明細用細線分隔。版面更乾淨，一屏可看更多筆。",
      b: "<strong>B 月結儀表板</strong>：記帳頁先看「這個月過得怎樣」。主視覺改成淨資產／結餘大卡，下面才是最近明細。帳戶頁用同一套面板，比較像總覽而不是清單堆疊。",
      c: "<strong>C 精煉日卡片</strong>：最接近現況。三格摘要保留，但同一天的記帳收進一張卡片，帳戶也改成細邊框、少陰影。改動最小、辨識度最高。"
    };
    const NAV = (on) => `
      <nav class="nav">
        <button class="nav-btn ${on==="home"?"on":""}"><span>📒</span>記帳</button>
        <button class="nav-btn ${on==="acc"?"on":""}"><span>🏦</span>帳戶</button>
        <button class="fab">+</button>
        <button class="nav-btn"><span>📊</span>報表</button>
        <button class="nav-btn"><span>🗂️</span>專案</button>
      </nav>`;

    const homeA = `
      <div class="scroll">
        <div class="top">
          <div class="month">9月</div>
          <div class="sub">2026　結餘 $8,432　較上月 +12%</div>
        </div>
        <div class="stats">
          <div class="stat"><span>收入</span><span class="money green">$42,000</span></div>
          <div class="stat"><span>支出</span><span class="money red">$33,568</span></div>
          <div class="stat"><span>預算</span><span class="mid">已花 67%</span></div>
        </div>
        <div class="search">搜尋備註、分類、帳戶…</div>
        <div class="group">
          <div class="date">9月15日</div>
          <div class="item"><div class="emoji">🍜</div><div><div class="name">飲食・早餐</div><div class="meta">日幣帳戶</div></div><div class="amt red">-$411</div></div>
          <div class="item"><div class="emoji">🔄</div><div><div class="name">美金 → 台幣</div><div class="meta">轉帳</div></div><div class="amt">$20.23</div></div>
        </div>
        <div class="group">
          <div class="date">9月9日</div>
          <div class="item"><div class="emoji">🍜</div><div><div class="name">飲食・早餐</div><div class="meta">台新卡</div></div><div class="amt red">-$200</div></div>
          <div class="item"><div class="emoji">🚌</div><div><div class="name">交通・加油</div><div class="meta">台幣</div></div><div class="amt red">-$1,280</div></div>
        </div>
      </div>${NAV("home")}`;

    const accA = `
      <div class="scroll">
        <div class="ah">
          <div class="sub">淨資產</div>
          <div class="hero">$234,741</div>
          <div class="split"><span>資產 $235,941</span><span>負債 $1,200</span></div>
        </div>
        <div class="hdr">信用卡</div>
        <div class="group">
          <div class="item"><div class="emoji">💳</div><div><div class="name">台新卡</div></div><div class="amt red">-$1,200</div></div>
          <div class="item"><div class="emoji">💳</div><div><div class="name">信用卡2</div></div><div class="amt">$0</div></div>
        </div>
        <div class="hdr">證券</div>
        <div class="group">
          <div class="item"><div class="emoji">📈</div><div><div class="name">測試</div></div><div class="amt">$0</div></div>
        </div>
        <div class="hdr">銀行</div>
        <div class="group">
          <div class="item"><div class="emoji">🏦</div><div><div class="name">美金</div><div class="meta">USD 982.66</div></div><div class="amt">$31,799</div></div>
          <div class="item"><div class="emoji">🏦</div><div><div class="name">台幣</div></div><div class="amt">$200,643</div></div>
          <div class="item"><div class="emoji">🏦</div><div><div class="name">日幣帳戶</div><div class="meta">JPY 18,000</div></div><div class="amt">$3,688</div></div>
        </div>
      </div>${NAV("acc")}`;

    const homeB = `
      <div class="scroll">
        <div class="hero-card">
          <div class="k">2026年9月　結餘</div>
          <div class="v">$8,432</div>
          <div class="bars">
            <div class="mini"><div class="k">收入</div><div class="v">$42,000</div></div>
            <div class="mini"><div class="k">支出</div><div class="v">$33,568</div></div>
          </div>
        </div>
        <div class="tools">
          <div class="chip">‹ 9月 ›</div>
          <div class="chip">搜尋</div>
          <div class="chip">篩選</div>
        </div>
        <div class="panel">
          <h4>最近記帳</h4>
          <div class="item"><div class="dot"></div><div><div class="name">飲食・早餐</div><div class="meta">9/15　日幣帳戶</div></div><div class="amt red">-$411</div></div>
          <div class="item"><div class="dot" style="background:#4e8f7c"></div><div><div class="name">美金 → 台幣</div><div class="meta">9/15　轉帳</div></div><div class="amt">$20</div></div>
          <div class="item"><div class="dot"></div><div><div class="name">飲食・早餐</div><div class="meta">9/9　台新卡</div></div><div class="amt red">-$200</div></div>
          <div class="item"><div class="dot"></div><div><div class="name">交通・加油</div><div class="meta">9/9　台幣</div></div><div class="amt red">-$1,280</div></div>
        </div>
      </div>${NAV("home")}`;

    const accB = `
      <div class="scroll">
        <div class="hero-card">
          <div class="k">淨資產</div>
          <div class="v">$234,741</div>
          <div class="bars">
            <div class="mini"><div class="k">資產</div><div class="v">$235,941</div></div>
            <div class="mini"><div class="k">負債</div><div class="v">$1,200</div></div>
          </div>
        </div>
        <div class="acc">
          <div class="lab">信用卡</div>
          <div class="item"><div>💳</div><div class="name">台新卡</div><div class="amt red">-$1,200</div></div>
          <div class="item"><div>💳</div><div class="name">信用卡2</div><div class="amt">$0</div></div>
          <div class="lab">證券</div>
          <div class="item"><div>📈</div><div class="name">測試</div><div class="amt">$0</div></div>
          <div class="lab">銀行</div>
          <div class="item"><div>🏦</div><div><div class="name">美金</div><div class="meta">USD 982.66</div></div><div class="amt">$31,799</div></div>
          <div class="item"><div>🏦</div><div class="name">台幣</div><div class="amt">$200,643</div></div>
          <div class="item"><div>🏦</div><div><div class="name">日幣帳戶</div><div class="meta">JPY 18,000</div></div><div class="amt">$3,688</div></div>
        </div>
      </div>${NAV("acc")}`;

    const homeC = `
      <div class="scroll">
        <div class="bar">‹　2026年9月　›</div>
        <div class="sum">
          <div class="card"><div class="k">收入</div><div class="v green">$42,000</div></div>
          <div class="card"><div class="k">支出</div><div class="v red">$33,568</div></div>
          <div class="card"><div class="k">結餘</div><div class="v" style="color:#4e8f7c">$8,432</div></div>
        </div>
        <div class="search"><div>搜尋備註、分類、帳戶…</div></div>
        <div class="day">
          <div class="day-h"><span>9月15日</span><span class="red">-$411</span></div>
          <div class="item"><div class="ico">🍜</div><div><div class="name">飲食・早餐</div><div class="meta">日幣帳戶</div></div><div class="amt red">-$411</div></div>
          <div class="item"><div class="ico" style="background:#e6f6f0">🔄</div><div><div class="name">美金 → 台幣</div><div class="meta">轉帳</div></div><div class="amt">$20.23</div></div>
        </div>
        <div class="day">
          <div class="day-h"><span>9月9日</span><span class="red">-$1,480</span></div>
          <div class="item"><div class="ico">🍜</div><div><div class="name">飲食・早餐</div><div class="meta">台新卡</div></div><div class="amt red">-$200</div></div>
          <div class="item"><div class="ico">🚌</div><div><div class="name">交通・加油</div><div class="meta">台幣</div></div><div class="amt red">-$1,280</div></div>
        </div>
      </div>${NAV("home")}`;

    const accC = `
      <div class="scroll">
        <div class="net"><div class="k">淨資產</div><div class="v">$234,741</div><div class="k" style="margin-top:6px">資產 $235,941　負債 $1,200</div></div>
        <div class="g"><h4>信用卡</h4>
          <div class="acc"><div>💳</div><div class="name">台新卡</div><div class="amt red">-$1,200</div></div>
          <div class="acc"><div>💳</div><div class="name">信用卡2</div><div class="amt">$0</div></div>
        </div>
        <div class="g"><h4>證券</h4>
          <div class="acc"><div>📈</div><div class="name">測試</div><div class="amt">$0</div></div>
        </div>
        <div class="g"><h4>銀行</h4>
          <div class="acc"><div>🏦</div><div><div class="name">美金</div><div class="meta">USD 982.66</div></div><div class="amt">$31,799</div></div>
          <div class="acc"><div>🏦</div><div class="name">台幣</div><div class="amt">$200,643</div></div>
          <div class="acc"><div>🏦</div><div><div class="name">日幣帳戶</div><div class="meta">JPY 18,000</div></div><div class="amt">$3,688</div></div>
        </div>
      </div>${NAV("acc")}`;

    const MAP = {
      a: { home: homeA, acc: accA, cls: "a" },
      b: { home: homeB, acc: accB, cls: "b" },
      c: { home: homeC, acc: accC, cls: "c" }
    };

    function render(style) {
      const m = MAP[style];
      desc.innerHTML = DESCS[style];
      homeScreen.className = "screen " + m.cls;
      accScreen.className = "screen " + m.cls;
      homeScreen.innerHTML = m.home;
      accScreen.innerHTML = m.acc;
    }
    document.querySelectorAll("#stylePicker button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#stylePicker button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        render(btn.dataset.style);
      });
    });
    render("a");
  </script>
</body>
</html>
